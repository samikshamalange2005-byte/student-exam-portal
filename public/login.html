<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - College Exam Timetable Portal</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">🎓</div>
      <span>Apex College Exams</span>
    </a>
    <div class="nav-links">
      <a href="/" class="btn btn-secondary btn-sm">Home</a>
      <a href="/register.html" class="btn btn-primary btn-sm">Register</a>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="container">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h1 id="loginTitle">Student Login</h1>
          <p id="loginSubtitle">Sign in to view your class exam timetable</p>
        </div>

        <!-- Role Switcher Tabs -->
        <div class="role-tabs">
          <button type="button" class="role-tab active" id="tabStudent" onclick="switchRole('student')">
            🎒 Student
          </button>
          <button type="button" class="role-tab" id="tabAdmin" onclick="switchRole('admin')">
            🏛️ Admin
          </button>
        </div>

        <!-- Feedback Alert -->
        <div id="alertBox" class="alert" style="display: none;"></div>

        <!-- Login Form -->
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input 
              type="email" 
              id="email" 
              class="form-control" 
              placeholder="e.g. yourname@college.edu" 
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="••••••••" 
              required
            >
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
            Sign In
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
          Don't have an account yet? 
          <a href="/register.html" id="registerLink" style="font-weight: 600;">Register here</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Apex College of Engineering & Technology.</p>
  </footer>

  <script src="/js/auth.js"></script>
  <script>
    let currentRole = 'student';

    function switchRole(role) {
      currentRole = role;
      const tabStudent = document.getElementById('tabStudent');
      const tabAdmin = document.getElementById('tabAdmin');
      const title = document.getElementById('loginTitle');
      const subtitle = document.getElementById('loginSubtitle');
      const registerLink = document.getElementById('registerLink');

      if (role === 'admin') {
        tabAdmin.classList.add('active');
        tabStudent.classList.remove('active');
        title.innerText = 'Admin Login';
        subtitle.innerText = 'Sign in to manage college examination schedules';
        registerLink.href = '/register.html?role=admin';
      } else {
        tabStudent.classList.add('active');
        tabAdmin.classList.remove('active');
        title.innerText = 'Student Login';
        subtitle.innerText = 'Sign in to view your class exam timetable';
        registerLink.href = '/register.html?role=student';
      }
      hideAlert();
    }

    function showAlert(message, type = 'danger') {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `alert alert-${type}`;
      alertBox.innerText = message;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';
    }

    // Initialize role based on URL query
    document.addEventListener('DOMContentLoaded', () => {
      redirectIfLoggedIn();

      const urlParams = new URLSearchParams(window.location.search);
      const roleParam = urlParams.get('role');
      if (roleParam === 'admin') {
        switchRole('admin');
      } else {
        switchRole('student');
      }
    });

    // Form Submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, expectedRole: currentRole })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Login failed. Please check your credentials.');
        }

        // Save auth data
        setAuth(data.token, data.user);

        showAlert('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          if (data.user.role === 'admin') {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/student-dashboard.html';
          }
        }, 600);

      } catch (err) {
        showAlert(err.message, 'danger');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
      }
    });
  </script>
</body>
</html>
